name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin-config: [zero-plugins, fictional-plugin]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run syntax
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run test:visual
      - run: npm run scan:public
      - run: npm audit --audit-level=high
      - run: PLUGIN_CONFIG_FILE="$PWD/config/${{ matrix.plugin-config }}.json" DATA_DIR="$RUNNER_TEMP/data-${{ matrix.plugin-config }}" node server/scripts/migrate.js
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t techsitemanager:ci .
